name: carshopsite

services:
  db:
    image: mariadb:11.4
    container_name: lv_db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-lojaveiculos}
      MARIADB_USER: ${DB_USER:-wp}
      MARIADB_PASSWORD: ${DB_PASSWORD:-wp}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    image: wordpress:php8.2-apache
    container_name: lv_wp
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WP_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME:-lojaveiculos}
      WORDPRESS_DB_USER: ${DB_USER:-wp}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-wp}
      WORDPRESS_DEBUG: ${WP_DEBUG:-1}
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_DEBUG_LOG', true );
        define( 'WP_DEBUG_DISPLAY', false );
        define( 'SCRIPT_DEBUG', true );
        define( 'DISALLOW_FILE_EDIT', true );
        define( 'WP_ENVIRONMENT_TYPE', 'local' );
        define( 'AUTOMATIC_UPDATER_DISABLED', true );
    volumes:
      - wp_core:/var/www/html
      - ./plugin-lv-estoque:/var/www/html/wp-content/plugins/plugin-lv-estoque
      - ./tema-lv:/var/www/html/wp-content/themes/tema-lv
      - ./docker/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
      - ./docker/vendor:/var/www/html/wp-content/lv-vendor

  wpcli:
    image: wordpress:cli-php8.2
    container_name: lv_cli
    user: "33:33"
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME:-lojaveiculos}
      WORDPRESS_DB_USER: ${DB_USER:-wp}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-wp}
    volumes:
      - wp_core:/var/www/html
      - ./plugin-lv-estoque:/var/www/html/wp-content/plugins/plugin-lv-estoque
      - ./tema-lv:/var/www/html/wp-content/themes/tema-lv
      - ./docker:/lv-docker
      - ./deploy:/lv-deploy
    entrypoint: ["tail", "-f", "/dev/null"]

  phpmyadmin:
    image: phpmyadmin:5
    container_name: lv_pma
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PMA_PORT:-8081}:80"
    environment:
      PMA_HOST: db
      PMA_USER: ${DB_USER:-wp}
      PMA_PASSWORD: ${DB_PASSWORD:-wp}
      UPLOAD_LIMIT: 128M

  mailpit:
    image: axllent/mailpit:latest
    container_name: lv_mail
    restart: unless-stopped
    ports:
      - "${MAILPIT_PORT:-8025}:8025"

volumes:
  db_data:
  wp_core:
